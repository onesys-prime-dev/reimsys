name: CI

# Typecheck, unit tests and a full build. Called by the staging and production
# deploy workflows and run on pull requests.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reimsys/api db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # One stable check to require in branch protection. It stays green only when
  # every job above succeeded, so jobs can be added or renamed above without
  # touching the repository settings.
  ci-passed:
    name: CI Passed
    needs: [ci]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::CI did not pass."
            exit 1
          fi
          echo "CI passed."
