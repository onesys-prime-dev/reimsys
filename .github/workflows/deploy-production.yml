name: 🚀 Deploy Reimsys to production

# Production is deployed by pushing a version tag (v1.2.3) on a commit that is
# already on main, never by a merge. Order: the tag is checked, CI runs on the
# tagged commit, then the deploy job waits in the "production" GitHub
# Environment for the approval its protection rules ask for, and only then
# touches the server. The deploy steps are shared with staging
# (deploy-reusable.yml).
on:
  push:
    tags:
      - "v*"
  # Re-run a failed or rejected production deploy: open the Actions tab, press
  # "Run workflow", and choose the TAG (not a branch) under "Use workflow from".
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The ref is a version tag on main
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Production deploys run from a tag, not from '$REF_NAME'. Choose the tag under 'Use workflow from'."
            exit 1
          fi
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$REF_NAME' is not a version tag like v1.2.3."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$REF_NAME points at a commit that is not on main. Production only gets code that went through a reviewed merge."
            exit 1
          fi
          echo "$REF_NAME is on main."

  ci:
    name: CI
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Production
    needs: ci
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: production
    secrets: inherit
